name: Research checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m brain_states.simulation --no-show --output-dir tmp/ci/signals
      - run: python -m brain_states.experiments.baseline --no-show --input tmp/ci/signals/overlapping_signals.npz --output-dir tmp/ci/baseline
      - run: python -m brain_states.experiments.connectivity --no-show --output-dir tmp/ci/connectivity
